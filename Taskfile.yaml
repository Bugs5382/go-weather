version: '3'
vars:
  ARTIFACT_NAME: go-weather
  TESTPARALLELISM: 4
  GOLIC_VERSION: v0.3.0
  COMMON_LIC: "2026 Shane"
  TEMPLATE_LIC: "mit"
tasks:
  default:
    cmds:
      - task: lint
  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
      - goimports -w ./
  build:
    desc: Build all packages
    cmds:
      - go build ./...
  test:
    desc: Run tests
    cmds:
      - go test -parallel {{.TESTPARALLELISM}} ./...
  test-cover:
    desc: Run tests with coverage reporting
    cmds:
      - go test ./... -cover
  purity:
    desc: >
      Prove the core reaches no network. The whole design rests on it: the
      vocabulary and the extraction are pure, and every fetch lives in an
      adapter subpackage the core does not import. An accidental import would
      be invisible in every test and would force an HTTP client on consumers
      that only wanted the vocabulary.
    cmds:
      - |
        if go list -deps . | grep -qx 'net/http'; then
          echo "the core imports net/http, directly or transitively:"
          go list -deps . | grep -x 'net/http'
          echo "move whatever fetches into provider/, alert/ or space/"
          exit 1
        fi
        echo "core is offline: no net/http in its dependency graph"

  lint:
    desc: Run all linters
    deps: [test, purity]
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - golangci-lint run
      - yamllint .
  lint-init:
    desc: Install lint dependencies via Brew
    cmds:
      - brew install golangci-lint gitleaks yamllint
      - go install golang.org/x/tools/cmd/goimports@latest
  license:
    desc: Verify every source file carries the MIT license header (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --dry -x
  license:fix:
    desc: Inject the MIT header into any source file missing it.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}"
